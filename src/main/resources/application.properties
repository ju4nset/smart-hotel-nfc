spring.application.name=smart-hotel-nfc

# MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/smart_hotel_nfc
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# GOOGLE OAUTH2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email


# Asaas
asaas.api.url=${ASAAS_API_URL:https://api-sandbox.asaas.com/v3}
asaas.api.key=${ASAAS_API_KEY}

asaas.api.token=${ASAAS_API_KEY}


app.public-url=${APP_PUBLIC_URL}