spring.application.name=smart-hotel-nfc

# --- BANCO DE DADOS (Usa MySQL local por padrão e Postgres no Heroku) ---
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/smart_hotel_nfc?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- GOOGLE OAUTH2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# --- ASAAS ---
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/v3}
asaas.api.key=${ASAAS_API_KEY}
asaas.api.token=${ASAAS_API_KEY}  
# // futuramente, deixar assim : asaas.api.token=${ASAAS_API_TOKEN}

app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG